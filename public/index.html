<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InferenceHub – Jarvis Labs</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #ffffff;
        color: #111111;
      }
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'SF Mono', 'Fira Code', monospace;
        --font-serif: Georgia, serif;
        --color-text-primary: #111111;
        --color-text-secondary: #666666;
        --color-text-tertiary: #999999;
        --color-text-info: #1d4ed8;
        --color-text-success: #166534;
        --color-text-warning: #854d0e;
        --color-text-danger: #991b1b;
        --color-background-primary: #ffffff;
        --color-background-secondary: #f5f5f5;
        --color-background-tertiary: #ebebeb;
        --color-background-info: #dbeafe;
        --color-background-success: #dcfce7;
        --color-background-warning: #fef9c3;
        --color-background-danger: #fee2e2;
        --color-border-tertiary: #e5e5e5;
        --color-border-secondary: #cccccc;
        --color-border-primary: #aaaaaa;
        --color-border-info: #3b82f6;
        --color-border-success: #86efac;
        --color-border-warning: #fde68a;
        --color-border-danger: #fca5a5;
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
        --border-radius-xl: 16px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1a1a; color: #f0f0f0; }
        :root {
          --color-text-primary: #f0f0f0;
          --color-text-secondary: #aaaaaa;
          --color-text-tertiary: #777777;
          --color-text-info: #93c5fd;
          --color-text-success: #86efac;
          --color-text-warning: #fde68a;
          --color-text-danger: #fca5a5;
          --color-background-primary: #1a1a1a;
          --color-background-secondary: #2a2a2a;
          --color-background-tertiary: #333333;
          --color-background-info: #1e3a5f;
          --color-background-success: #14532d;
          --color-background-warning: #422006;
          --color-background-danger: #450a0a;
          --color-border-tertiary: #333333;
          --color-border-secondary: #444444;
          --color-border-primary: #555555;
        }
      }
      select, input[type="text"] {
        width: 100%;
        padding: 7px 10px;
        border: 0.5px solid var(--color-border-secondary);
        border-radius: 8px;
        background: var(--color-background-primary);
        color: var(--color-text-primary);
        font-size: 13px;
        font-family: inherit;
      }
      input[type="range"] { width: 100%; accent-color: var(--color-text-primary); }
      input[type="checkbox"] { accent-color: var(--color-text-primary); }
      button { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
